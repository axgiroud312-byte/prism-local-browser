<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>#36 合成组件证据</title>
<style>body{margin:24px;background:#f5f5f5;color:#595959;font:14px/1.6 system-ui,sans-serif}h1{font-size:22px}button{padding:8px 14px;margin:0 8px 12px 0;cursor:pointer;border:1px solid #2f54eb;color:#2f54eb;background:white;border-radius:3px}button[aria-pressed=true]{background:#2f54eb;color:white}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}figure{margin:0;background:white;padding:10px;border-radius:3px}img{width:100%;height:auto}figcaption{overflow-wrap:anywhere}small{display:block;color:#8c8c8c}a{color:#2f54eb}@media(max-width:500px){main{grid-template-columns:1fr}body{margin:12px}}</style></head>
<body><h1>#36 合成截图 · 不是真实桌面验收</h1><p>独立组件 wiring 为主，最后两项仅检查实际 App 安全层级。MAIN 页面接入与最终视觉验收仍待完成；此页不包含原商业参考图。</p><p><a href="../../verification/issue36.md">验证记录</a> · <a href="screenshots.json">尺寸/来源/哈希索引</a></p><nav aria-label="证据视口"><button data-size="1440x900" aria-pressed="true">1440 × 900</button><button data-size="1280x800" aria-pressed="false">1280 × 800</button></nav><p id="summary">正在读取索引…</p><main></main>
<script type="module">
const data=await fetch('./screenshots.json').then(response=>response.json()),main=document.querySelector('main');
function render(size){main.replaceChildren();for(const item of data.results.filter(item=>item.file.startsWith(size))){const figure=document.createElement('figure'),link=document.createElement('a'),image=document.createElement('img'),caption=document.createElement('figcaption'),note=document.createElement('small');link.href=item.file;link.target='_blank';link.rel='noreferrer';link.setAttribute('aria-label','查看 '+item.id+' '+size+' 合成截图');image.src=item.file;image.alt=item.id+'，合成数据';image.width=item.png.width;image.height=item.png.height;image.loading=main.childElementCount<3?'eager':'lazy';link.append(image);caption.textContent=item.id;note.textContent=item.mapping.kind+' → '+item.mapping.referenceId+' · '+(item.actualAppIntegration?'实际 App 安全边界':'独立组件 harness');caption.append(note);figure.append(link,caption);main.append(figure)}document.querySelector('#summary').textContent=data.states.length+' 个状态 × 两视口 = '+data.screenshotCount+' 张合成图；点击原尺寸查看。';for(const button of document.querySelectorAll('[data-size]'))button.setAttribute('aria-pressed',String(button.dataset.size===size))}
for(const button of document.querySelectorAll('[data-size]'))button.addEventListener('click',()=>render(button.dataset.size));render('1440x900');
</script></body></html>
