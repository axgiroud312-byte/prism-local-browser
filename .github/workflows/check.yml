name: Check prototype, desktop and documents
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci
      - name: Install fixed Wails CLI in the project tool directory
        shell: pwsh
        run: |
          $env:GOPATH = "$PWD/.tools/gopath"
          $env:GOCACHE = "$PWD/.tools/gocache"
          $env:GOBIN = "$PWD/.tools/bin"
          $env:GOTOOLCHAIN = 'local'
          $env:CGO_ENABLED = '0'
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: npm run test:desktop
      - run: npm run build:installer
      - run: npm run build:installer -- -PreviewRevision 2
      - name: Provision WebView2 on the disposable test host if missing
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ensure-ci-webview.ps1
      - name: Real install, UI create/reopen, upgrade, retain-uninstall, reinstall and explicit removal
        run: npm run verify:installer -- --silent-wizard
        env:
          PRISM_VERIFY_NO_SCREENSHOT: "1"
      - name: Retain actual installer artifacts and synthetic installation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-amd64-development-preview
          path: |
            build/releases/
            output/goal/T03/installer-verification.json
            output/goal/T03/preview-*/uia-verification.json
            output/goal/T03/preview-*/failed-controls.txt
          if-no-files-found: error
