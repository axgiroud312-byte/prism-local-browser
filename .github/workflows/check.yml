name: Browser interaction tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser clicks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      # Playwright starts Vite itself. No production build or native installation.
      - run: npm run test:ui
      - name: Save failed browser test report and traces
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-test-failure
          path: output/playwright/
          retention-days: 7
          if-no-files-found: ignore
